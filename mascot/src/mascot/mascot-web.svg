<!--
  LAVAALL Companions — Web skin (cat-inspired companion) v1.3
  Original artwork for the LAVAALL mascot prototype. Same rig, scale, face
  panel and eye shapes as the Technology robot (CHARACTER_BIBLE: "match the
  robot's scale, screen-face size, eye animation"). Distinguished by two small
  cat ears, a curved tail, whiskers, a softer mouth and a collar tag instead of
  the antenna. A friendly AI creature, not a realistic or emoji cat.

  Palette (all sourced from api/web/_site/styles.css, see BRAND_AUDIT_RESULTS.md):
    #F5ECE5 cream shell · #0B252A teal joints · #10323A teal panel
    #E7D3BF sand accent · #0A0A14 shared ink face · #FFFFFF highlight
  Web "sun" (#F7E04A) and "focus" violet (#8B7CFF) are CTA/focus-only in
  the source, so they are deliberately not used here.

  Shared rig (identical coordinates in mascot-base.svg):
    #web-root #web-shadow #web-tail #web-leg-left #web-leg-right #web-body
    #web-collar-tag #web-badge #web-arm-left #web-arm-right #web-head
    #web-ear-left #web-ear-right #web-face #web-eye-left #web-eye-right
    #web-mouth #web-think-dots #web-speak-bars
-->
<svg id="mascot-web-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160" role="img" aria-label="LAVAALL Web cat-inspired companion" style="overflow:visible">
  <g id="web-root">
    <ellipse id="web-shadow" cx="60" cy="152" rx="30" ry="5" fill="#E7D3BF" opacity="0.25"/>

    <g id="web-tail" style="transform-origin:84px 130px">
      <path d="M 84 130 C 104 144 124 132 121 106" stroke="#0B252A" stroke-opacity="0.25" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M 84 130 C 104 144 124 132 121 106" stroke="#F5ECE5" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M 122.5 115 C 123 111 122.5 108 121 106" stroke="#E7D3BF" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>

    <g id="web-leg-left" style="transform-origin:42px 124px">
      <rect x="32" y="120" width="20" height="28" rx="10" fill="#F5ECE5" stroke="#0B252A" stroke-opacity="0.25" stroke-width="1"/>
      <ellipse cx="42" cy="148" rx="12" ry="6" fill="#0B252A"/>
    </g>
    <g id="web-leg-right" style="transform-origin:78px 124px">
      <rect x="68" y="120" width="20" height="28" rx="10" fill="#F5ECE5" stroke="#0B252A" stroke-opacity="0.25" stroke-width="1"/>
      <ellipse cx="78" cy="148" rx="12" ry="6" fill="#0B252A"/>
    </g>

    <g id="web-body">
      <ellipse cx="60" cy="105" rx="38" ry="32" fill="#F5ECE5" stroke="#0B252A" stroke-opacity="0.25" stroke-width="1"/>
      <path d="M 30 82 Q 60 94 90 82" stroke="#10323A" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle id="web-collar-tag" cx="60" cy="91" r="3.5" fill="#E7D3BF" style="transform-origin:60px 91px"/>
      <g id="web-badge">
        <rect x="46" y="96" width="28" height="22" rx="7" fill="#0B252A"/>
        <path d="M 51 100.5 L 56.5 100.5 L 60 109 L 63.5 100.5 L 69 100.5 L 62 114 L 58 114 Z" fill="#E7D3BF"/>
      </g>
    </g>

    <g id="web-arm-left" style="transform-origin:24px 92px">
      <rect x="8" y="88" width="18" height="30" rx="9" fill="#F5ECE5" stroke="#0B252A" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="17" cy="120" r="8" fill="#0B252A"/>
    </g>
    <g id="web-arm-right" style="transform-origin:96px 92px">
      <rect x="94" y="88" width="18" height="30" rx="9" fill="#F5ECE5" stroke="#0B252A" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="103" cy="120" r="8" fill="#0B252A"/>
    </g>

    <g id="web-head" style="transform-origin:60px 70px">
      <g id="web-ear-left" style="transform-origin:38px 26px">
        <path d="M 25 36 L 29 7 L 51 22 Z" fill="#F5ECE5" stroke="#F5ECE5" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 25 36 L 29 7 L 51 22" fill="none" stroke="#0B252A" stroke-opacity="0.25" stroke-width="1" stroke-linejoin="round"/>
        <path d="M 31 28 L 32.5 15 L 44 22.5 Z" fill="#E7D3BF" stroke="#E7D3BF" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <g id="web-ear-right" style="transform-origin:82px 26px">
        <path d="M 95 36 L 91 7 L 69 22 Z" fill="#F5ECE5" stroke="#F5ECE5" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 95 36 L 91 7 L 69 22" fill="none" stroke="#0B252A" stroke-opacity="0.25" stroke-width="1" stroke-linejoin="round"/>
        <path d="M 89 28 L 87.5 15 L 76 22.5 Z" fill="#E7D3BF" stroke="#E7D3BF" stroke-width="2" stroke-linejoin="round"/>
      </g>

      <ellipse cx="60" cy="50" rx="38" ry="34" fill="#F5ECE5" stroke="#0B252A" stroke-opacity="0.25" stroke-width="1"/>
      <ellipse cx="60" cy="25" rx="16" ry="4.5" fill="#FFFFFF" opacity="0.6"/>

      <g id="web-whiskers" stroke="#10323A" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
        <path d="M 25 56 L 12 52"/>
        <path d="M 25 61 L 12 62"/>
        <path d="M 95 56 L 108 52"/>
        <path d="M 95 61 L 108 62"/>
      </g>

      <rect id="web-face" x="28" y="30" width="64" height="42" rx="14" fill="#0A0A14"/>
      <rect x="28" y="30" width="64" height="42" rx="14" fill="none" stroke="#E7D3BF" stroke-width="1.5" opacity="0.5"/>

      <g id="web-eye-left" style="transform-origin:45px 48px">
        <path d="M 38 52 Q 45 43 52 52" stroke="#E7D3BF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="45" cy="48" r="5" fill="#E7D3BF" opacity="0.15"/>
      </g>
      <g id="web-eye-right" style="transform-origin:75px 48px">
        <path d="M 68 52 Q 75 43 82 52" stroke="#E7D3BF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="75" cy="48" r="5" fill="#E7D3BF" opacity="0.15"/>
      </g>

      <g id="web-mouth">
        <path d="M 58 58 L 62 58 L 60 60.5 Z" fill="#E7D3BF" stroke="#E7D3BF" stroke-width="1" stroke-linejoin="round"/>
        <path d="M 52 61 Q 56 66 60 61.5 Q 64 66 68 61" stroke="#E7D3BF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g id="web-think-dots" opacity="0">
        <circle cx="48" cy="51" r="3" fill="#E7D3BF"/>
        <circle cx="60" cy="51" r="3" fill="#E7D3BF"/>
        <circle cx="72" cy="51" r="3" fill="#E7D3BF"/>
      </g>

      <g id="web-speak-bars" opacity="0" style="transform-origin:60px 51px">
        <rect x="44" y="47" width="4" height="8" rx="2" fill="#E7D3BF"/>
        <rect x="52" y="44" width="4" height="14" rx="2" fill="#E7D3BF"/>
        <rect x="60" y="46" width="4" height="10" rx="2" fill="#E7D3BF"/>
        <rect x="68" y="43" width="4" height="16" rx="2" fill="#E7D3BF"/>
        <rect x="76" y="47" width="4" height="8" rx="2" fill="#E7D3BF"/>
      </g>
    </g>
  </g>
</svg>
