<svg id="mascot-tech-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160" role="img" aria-label="LAVAALL Technology robot companion" style="overflow:visible">
  <defs>
    <linearGradient id="tech-vgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#00F5A0"/>
    </linearGradient>
  </defs>
  <g id="tech-root">
    <ellipse id="tech-shadow" cx="60" cy="152" rx="30" ry="5" fill="#00C2FF" opacity="0.22"/>

    <g id="tech-leg-left" style="transform-origin:42px 124px">
      <rect x="32" y="120" width="20" height="28" rx="10" fill="#F4F9FF" stroke="#5A6A80" stroke-opacity="0.35" stroke-width="1"/>
      <ellipse cx="42" cy="148" rx="12" ry="6" fill="#0A0A14"/>
    </g>
    <g id="tech-leg-right" style="transform-origin:78px 124px">
      <rect x="68" y="120" width="20" height="28" rx="10" fill="#F4F9FF" stroke="#5A6A80" stroke-opacity="0.35" stroke-width="1"/>
      <ellipse cx="78" cy="148" rx="12" ry="6" fill="#0A0A14"/>
    </g>

    <g id="tech-body">
      <ellipse cx="60" cy="105" rx="38" ry="32" fill="#F4F9FF" stroke="#5A6A80" stroke-opacity="0.35" stroke-width="1"/>
      <path d="M 26 112 Q 60 126 94 112" stroke="#00C2FF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>
      <g id="tech-badge">
        <rect x="46" y="94" width="28" height="22" rx="7" fill="#0A0A14"/>
        <path d="M 51 98.5 L 56.5 98.5 L 60 107 L 63.5 98.5 L 69 98.5 L 62 112 L 58 112 Z" fill="url(#tech-vgrad)"/>
      </g>
    </g>

    <g id="tech-arm-left" style="transform-origin:24px 92px">
      <rect x="8" y="88" width="18" height="30" rx="9" fill="#F4F9FF" stroke="#5A6A80" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="17" cy="120" r="8" fill="#0A0A14"/>
    </g>
    <g id="tech-arm-right" style="transform-origin:96px 92px">
      <rect x="94" y="88" width="18" height="30" rx="9" fill="#F4F9FF" stroke="#5A6A80" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="103" cy="120" r="8" fill="#0A0A14"/>
    </g>

    <g id="tech-head" style="transform-origin:60px 70px">
      <g id="tech-ear-left" style="transform-origin:25px 51px">
        <rect x="16" y="38" width="18" height="26" rx="9" fill="#F4F9FF" stroke="#5A6A80" stroke-opacity="0.35" stroke-width="1"/>
        <rect x="18.5" y="41" width="13" height="20" rx="6.5" fill="#0A0A14"/>
        <circle cx="25" cy="51" r="3" fill="#00C2FF"/>
      </g>
      <g id="tech-ear-right" style="transform-origin:95px 51px">
        <rect x="86" y="38" width="18" height="26" rx="9" fill="#F4F9FF" stroke="#5A6A80" stroke-opacity="0.35" stroke-width="1"/>
        <rect x="88.5" y="41" width="13" height="20" rx="6.5" fill="#0A0A14"/>
        <circle cx="95" cy="51" r="3" fill="#00C2FF"/>
      </g>

      <ellipse cx="60" cy="50" rx="38" ry="34" fill="#F4F9FF" stroke="#5A6A80" stroke-opacity="0.35" stroke-width="1"/>
      <ellipse cx="60" cy="27" rx="18" ry="5" fill="#FFFFFF" opacity="0.7"/>

      <g id="tech-antenna" style="transform-origin:60px 16px">
        <rect x="58" y="10" width="4" height="10" rx="2" fill="#0A0A14"/>
        <circle cx="60" cy="9" r="6" fill="#00C2FF"/>
        <circle cx="58" cy="7" r="2" fill="#FFFFFF" opacity="0.7"/>
      </g>

      <rect id="tech-face" x="28" y="30" width="64" height="42" rx="12" fill="#0A0A14"/>
      <rect x="28" y="30" width="64" height="42" rx="12" fill="none" stroke="#00C2FF" stroke-width="1.5" opacity="0.5"/>

      <g id="tech-eye-left" opacity="0" style="transform-origin:45px 48px">
        <path d="M 38 52 Q 45 43 52 52" stroke="#00C2FF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="45" cy="48" r="5" fill="#00C2FF" opacity="0.15"/>
      </g>
      <g id="tech-eye-right" opacity="0" style="transform-origin:75px 48px">
        <path d="M 68 52 Q 75 43 82 52" stroke="#00C2FF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="75" cy="48" r="5" fill="#00C2FF" opacity="0.15"/>
      </g>

      <path id="tech-mouth" opacity="0" d="M 52 61 Q 60 67 68 61" stroke="#00C2FF" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <g id="tech-think-dots" opacity="0">
        <circle cx="48" cy="51" r="3" fill="#00C2FF"/>
        <circle cx="60" cy="51" r="3" fill="#00C2FF"/>
        <circle cx="72" cy="51" r="3" fill="#00C2FF"/>
      </g>

      <g id="tech-speak-bars" opacity="1" style="transform-origin:60px 51px">
        <rect x="44" y="47" width="4" height="8" rx="2" fill="#00C2FF"/>
        <rect x="52" y="44" width="4" height="14" rx="2" fill="#00C2FF"/>
        <rect x="60" y="46" width="4" height="10" rx="2" fill="#00C2FF"/>
        <rect x="68" y="43" width="4" height="16" rx="2" fill="#00C2FF"/>
        <rect x="76" y="47" width="4" height="8" rx="2" fill="#00C2FF"/>
      </g>
    </g>
  </g>
</svg>
