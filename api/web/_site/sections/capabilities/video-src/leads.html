<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lead finder demo</title><link rel="stylesheet" href="base.css"><style>
.hd{font:500 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.sc{width:120px;height:10px;border:1px solid var(--line);position:relative}
.sc b{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--accent);transform-origin:left;transform:scaleX(var(--v,0))}
.row.hot{background:#2a2823}
.q{left:56px;top:100px;width:1168px;height:60px;display:flex;align-items:center;padding:0 20px;font:500 18px var(--mono);color:var(--text)}
</style></head><body><div id="stage">
<div class="title"><b>03</b><span class="lab">Lead finder</span></div>
<div class="panel q" id="q"><span class="lab" style="margin-right:16px">Search</span><span id="qt"></span></div>
<div class="panel" style="left:56px;top:180px;width:1168px;height:440px;overflow:hidden" id="tb">
<div class="ph"><span>Business type</span><span style="width:340px;display:flex;justify-content:space-between"><span>Area</span><span>Score</span><span>Contact first</span></div>
<div id="rows"></div></div>

<div class="cap" id="cap"></div><div class="wm">Illustrative demo</div>
</div><script src="engine.js"></script><script>
typeText('qt','Businesses near Freetown that may need a website',300,1800);
const data=[['Restaurant','Central',82],['Hotel','Coast road',91],['Pharmacy','Market area',64],['Boutique','Main street',58],['Supplies shop','Harbour',77],['Caterer','Hillside',70]];
const rows=document.getElementById('rows');
data.forEach((d,i)=>{const r=document.createElement('div');r.className='row';r.id='lr'+i;r.style.top=(i*56+46)+'px';
r.innerHTML='<span style="width:200px">'+d[0]+'</span><span class="m" style="width:180px">'+d[1]+'</span><span class="sp"></span><span class="sc"><b id="lb'+i+'"></b></span><span class="m" style="width:40px" id="ln'+i+'">0</span><span class="chip" id="lc'+i+'" style="width:96px;text-align:center;visibility:hidden">Top</span>';rows.appendChild(r);
vis('lr'+i,1800+i*350,null,{dy:10});
const sc=[82,91,64,58,77,70][i],t0=3900+i*300;
countTo('ln'+i,t0,t0+900,0,sc);
const b=document.getElementById('lb'+i);
fn(t=>{b.style.setProperty('--v',Math.min(1,Math.max(0,1-Math.pow(1-Math.min(1,Math.max(0,(t-t0)/900)),3)))*sc/100);});
if(sc>=77){const c=document.getElementById('lc'+i);fn(t=>{c.style.visibility=t>6300?'visible':'hidden';});cls('lr'+i,'hot',6300);}
});
seq('cap',[[0,'Looking for businesses near you'],[1800,'List builds itself'],[3900,'Each row gets a score'],[6300,'<i>Top three</i> to contact first. You choose who to approach']]);
</script></body></html>
