name: Production catalog browser audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 08 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'images/**'
      - 'api/**'
      - 'scripts/qa/**'
      - 'scripts/crm/**'
      - '.github/workflows/production-catalog-audit.yml'

permissions:
  contents: read
  issues: write

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://www.lavaall.com
      CRM_WEBHOOK_URL: ${{ secrets.CRM_WEBHOOK_URL }}
      CRM_WEBHOOK_SECRET: ${{ secrets.CRM_WEBHOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for production to be reachable
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then sleep 90; fi
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 15 "$BASE_URL/assets/data/catalog-generated.js" >/dev/null && curl -fsS --max-time 15 "$BASE_URL/#products" >/dev/null; then
              echo "Production is reachable."
              exit 0
            fi
            echo "Production not ready yet (attempt $attempt/12)."
            sleep 15
          done
          echo "Production did not become reachable in time."
          exit 1

      - name: Run exhaustive desktop and mobile audits
        id: audit
        shell: bash
        run: |
          set +e
          node scripts/qa/production-browser-audit.mjs --base-url "$BASE_URL" --report scripts/qa/reports/production-browser-audit-desktop.json
          DESKTOP=$?
          node scripts/qa/production-browser-audit.mjs --base-url "$BASE_URL" --mobile --report scripts/qa/reports/production-browser-audit-mobile.json
          MOBILE=$?
          echo "desktop_status=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "mobile_status=$MOBILE" >> "$GITHUB_OUTPUT"
          if [ "$DESKTOP" -ne 0 ] || [ "$MOBILE" -ne 0 ]; then
            exit 1
          fi

      - name: Sync verified products to CRM
        if: success() && env.CRM_WEBHOOK_URL != '' && env.CRM_WEBHOOK_SECRET != ''
        run: node scripts/crm/sync-google-sheet-products.mjs

      - name: Publish desktop QA to CRM
        if: success() && env.CRM_WEBHOOK_URL != '' && env.CRM_WEBHOOK_SECRET != ''
        run: node scripts/crm/publish-production-audit.mjs scripts/qa/reports/production-browser-audit-desktop.json

      - name: Publish mobile QA to CRM
        if: success() && env.CRM_WEBHOOK_URL != '' && env.CRM_WEBHOOK_SECRET != ''
        run: node scripts/crm/publish-production-audit.mjs scripts/qa/reports/production-browser-audit-mobile.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-catalog-browser-audit-${{ github.run_id }}
          path: scripts/qa/reports/production-browser-audit-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Open or update production audit incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production catalog browser audit failing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            const body = [
              `Production browser QA failed in workflow run ${context.runId}.`,
              '',
              `Commit: ${context.sha}`,
              `Event: ${context.eventName}`,
              `Desktop exit: ${{ steps.audit.outputs.desktop_status }}`,
              `Mobile exit: ${{ steps.audit.outputs.mobile_status }}`,
              '',
              'Inspect the uploaded audit JSON artifact before changing product media. A failed browser assertion is evidence to investigate; do not replace exact media with random images.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
