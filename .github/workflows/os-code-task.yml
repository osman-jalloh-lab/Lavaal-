name: LAVAALL OS coding task
run-name: "LAVAALL OS coding: ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Request ID (generated by the authenticated OS)"
        required: true
        type: string
      task:
        description: "Code change request. Never put secrets in this field."
        required: true
        type: string

# Model execution is never allowed to push, open a PR, modify protected branches,
# use production credentials, or mutate external services.
permissions:
  contents: read

concurrency:
  group: lavaall-os-code-runner
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the default branch without checkout credentials
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate dispatch inputs
        env:
          TASK_TEXT: ${{ inputs.task }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          node -e '
            const id = process.env.REQUEST_ID || "";
            const task = process.env.TASK_TEXT || "";
            if (!/^os-[a-f0-9-]{30,44}$/.test(id)) process.exit(1);
            if (!task.trim() || task.length > 2000) process.exit(1);
          '
      - name: Run Codex with workspace-only permissions
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt: |
            Work only in this disposable checkout of LAVAALL OS.
            Modify code to address the following request, using fake data for tests.
            Do not edit .github/, authentication, secrets, billing, deployments, or production configuration.
            Do not deploy, push, send messages, or access external user accounts.
            Do not claim work was tested unless it was actually executed.
            This job can produce a patch artifact only. A human must review and approve any integration.
            Task:
            ${{ inputs.task }}
      - name: Export code changes without privileged repository credentials
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -Eq '(^|[[:space:]])(\.github/|\.env|api/ops/auth|api/ops/_signin_hardening|vercel\.json)'; then
            echo "Protected file modifications are not allowed"
            exit 1
          fi
          git add -N -- .
          git diff --check
          git diff --binary > /tmp/lavaall-os-code.patch
          if [ ! -s /tmp/lavaall-os-code.patch ]; then
            echo "No source changes produced"
            exit 1
          fi
          test "$(wc -c < /tmp/lavaall-os-code.patch)" -le 500000
      - name: Upload patch for independent inspection
        uses: actions/upload-artifact@v4
        with:
          name: lavaall-os-code-patch
          path: /tmp/lavaall-os-code.patch
          retention-days: 7
          if-no-files-found: error

  test-patch:
    needs: edit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out the same source in a fresh runner
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download untrusted code patch
        uses: actions/download-artifact@v4
        with:
          name: lavaall-os-code-patch
          path: /tmp/os-patch
      - name: Verify and apply patch in isolated test runner
        run: |
          set -euo pipefail
          git apply --check /tmp/os-patch/lavaall-os-code.patch
          git apply /tmp/os-patch/lavaall-os-code.patch
      - name: Run no-network regression suite without provider secrets
        run: node tests/run-safe-suite.js
